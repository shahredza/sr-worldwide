<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin login · SR Worldwide</title>
  <link rel="icon" href="../assets/images/srlogo.jpg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/app.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</head>
<body class="admin" data-root="../" data-page="admin-login">
<main class="admin-login">
  <form class="form-card" id="admin-login-form" novalidate>
    <a class="brand" href="../index.html"><img src="../assets/images/srlogo.jpg" alt="" width="40" height="40"><span>SR Worldwide</span></a>
    <h1 style="font-size:1.8rem;text-align:center">Admin login</h1>
    <div class="alert alert-info">Design demo. Log in with <strong>admin</strong> / <strong>admin123</strong></div>
    <div id="form-errors"></div>
    <div class="field"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-block" type="submit">Log in</button>
    <p class="form-foot"><a href="../index.html">← Back to the shop</a></p>
  </form>
</main>
</body>
</html>
