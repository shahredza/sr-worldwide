<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · SR Worldwide</title>
  <meta name="description" content="SR Worldwide: streetwear tops, bottoms and accessories. Design demo.">
  <link rel="icon" href="assets/images/srlogo.jpg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body data-page="checkout" class="">
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="container flashes" id="flash"></div>
<section class="container page">
  <h1>Checkout</h1>
  <div class="checkout-layout">
    <form class="form-card" id="checkout-form" novalidate>
      <h2 style="font-size:1.4rem">Delivery details</h2>
      <div id="form-errors"></div>
      <div class="form-grid">
        <div class="field"><label for="fullname">Full name</label><input id="fullname" name="fullname" type="text" maxlength="100" autocomplete="name" required></div>
        <div class="field"><label for="nickname">Nickname</label><input id="nickname" name="nickname" type="text" maxlength="50" autocomplete="nickname" required></div>
        <div class="field span-2"><label for="street">Street address</label><input id="street" name="street" type="text" maxlength="255" autocomplete="street-address" required></div>
        <div class="field"><label for="city">City</label><input id="city" name="city" type="text" maxlength="100" autocomplete="address-level2" required></div>
        <div class="field"><label for="state">State</label><select id="state" name="state" autocomplete="address-level1" required></select></div>
        <div class="field"><label for="postcode">Postcode</label><input id="postcode" name="postcode" type="text" inputmode="numeric" maxlength="5" autocomplete="postal-code" required></div>
      </div>
      <p class="muted" style="font-size:.9rem">This is a design demo: no payment is taken and nothing is shipped. Please don’t enter real details.</p>
      <button class="btn btn-block" type="submit" id="place-order">Place order</button>
    </form>
    <aside class="summary" aria-label="Order summary" id="order-summary"></aside>
  </div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
