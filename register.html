<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · SR Worldwide</title>
  <meta name="description" content="SR Worldwide: streetwear tops, bottoms and accessories. Design demo.">
  <link rel="icon" href="assets/images/srlogo.jpg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body data-page="register" class="">
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="container flashes" id="flash"></div>
<section class="container page">
  <div class="auth-wrap">
    <form class="form-card" id="register-form" novalidate>
      <h1 style="font-size:2rem">Create an account</h1>
      <p class="muted">Join SR Worldwide to check out faster and track your orders.</p>
      <div id="form-errors"></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <p class="hint">At least 8 characters, with upper case, lower case and a number.</p>
        <label class="checkbox"><input type="checkbox" data-toggle-password="password"> Show password</label>
      </div>
      <div class="field"><label for="birthday">Birthday</label><input id="birthday" name="birthday" type="date" min="1900-01-01" required></div>
      <button class="btn btn-block" type="submit">Register</button>
      <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
