<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · SR Worldwide</title>
  <meta name="description" content="SR Worldwide: streetwear tops, bottoms and accessories. Design demo.">
  <link rel="icon" href="assets/images/srlogo.jpg">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body data-page="login" class="">
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="container flashes" id="flash"></div>
<section class="container page">
  <div class="auth-wrap">
    <form class="form-card" id="login-form" novalidate>
      <h1 style="font-size:2rem">Log in</h1>
      <p class="muted" style="font-size:.9rem">Demo: any email and password will work. Nothing is sent anywhere.</p>
      <div id="form-errors"></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <label class="checkbox"><input type="checkbox" data-toggle-password="password"> Show password</label>
      </div>
      <button class="btn btn-block" type="submit">Log in</button>
      <p class="form-foot">New here? <a href="register.html">Create an account</a></p>
    </form>
  </div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
